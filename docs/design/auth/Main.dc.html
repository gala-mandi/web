<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Galla Mandi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#3B0764}
input::placeholder{color:#8A8597}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background-color: #F6F3FF; font-family: Inter, system-ui, sans-serif; color: #1E1B2E">

  <div style="flex: 1 1 520px; display: flex; min-height: 100vh">
    <dc-import name="BrandPanel" theme="{{themeKey}}" hint-size="100%,900px"></dc-import>
  </div>

  <main style="flex: 1 1 480px; box-sizing: border-box; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; gap: 24px">
    <div style="width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
      <div role="group" aria-label="Language" style="display: inline-flex; padding: 4px; border-radius: 999px; background-color: #EDE9FE">
        <button type="button" style="border: 0; cursor: pointer; padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; background-color: #FFFFFF; color: #1E1B2E; box-shadow: 0 1px 2px rgba(30,27,46,0.12)">English</button>
        <button type="button" lang="ur" style="border: 0; cursor: pointer; padding: 2px 14px; border-radius: 999px; font-family: 'Noto Nastaliq Urdu', serif; font-size: 13px; background-color: transparent; color: #4B4659">اردو</button>
      </div>
      <a href="https://wa.me/" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; text-decoration: none; color: #4B4659"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.2 8L3 21l1.1-4.6A9 9 0 1 1 21 12z"/></svg>Help on WhatsApp</a>
    </div>

    <div style="flex: 1 1 auto; width: 100%; display: flex; align-items: center; justify-content: center">
      <div style="width: 100%; max-width: 420px; box-sizing: border-box; background-color: #FFFFFF; border-radius: 24px; padding: 40px 36px 28px; box-shadow: 0 1px 2px rgba(30,27,46,0.06), 0 28px 56px -16px rgba(76,29,149,0.22); display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Welcome back</h2>
          <p style="margin: 0; font-size: 15px; color: #5B5668">Sign in to your mandi account</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="si-user" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Phone number or username</label>
          <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 12px; border: 2px solid {{accent}}; box-shadow: 0 0 0 4px {{ring}}; background-color: #FFFFFF">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
            <input id="si-user" type="text" value="owner" autocomplete="username" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #1E1B2E">
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
            <label for="si-pass" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Password</label>
            <a href="ForgotPassword.dc.html" style="font-size: 13px; font-weight: 600; text-decoration: none; color: {{accent}}">Forgot password?</a>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 6px 0 14px; border-radius: 12px; border: 1px solid #DCD8E6; background-color: #FFFFFF">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="si-pass" type="{{pwType}}" placeholder="Your password" autocomplete="current-password" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #1E1B2E">
            <button type="button" aria-label="{{eyeLabel}}" onClick="{{toggleEye}}" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background-color: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #4B4659">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #3F3A4D; cursor: pointer">
          <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: {{accent}}; margin: 0">
          Keep me signed in on this device
        </label>

        <button type="button" style="height: 52px; border: 0; border-radius: 14px; cursor: pointer; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; background-image: linear-gradient(90deg, {{btnA}}, {{btnB}}); box-shadow: 0 10px 24px -8px {{btnShadow}}">
          Sign in <span aria-hidden="true">·</span> <span lang="ur" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 15px; font-weight: 600">داخل ہوں</span>
        </button>

        <div style="display: flex; flex-direction: column; gap: 2px; text-align: center">
          <span style="font-size: 13px; color: #5B5668">Staff member? Your shop owner can also reset your password.</span>
          <span lang="ur" dir="rtl" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 12px; line-height: 1.9; color: #5B5668">اسٹاف؟ آپ کا منڈی مالک بھی پاس ورڈ ری سیٹ کر سکتا ہے</span>
        </div>

        <div style="height: 1px; background-color: #EEEAF5"></div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 13px; font-weight: 600; color: #5B5668">Theme</span>
          <div style="display: flex; gap: 8px">
            <sc-for list="{{swatches}}" as="s" hint-placeholder-count="6">
              <button type="button" aria-label="{{s.label}}" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="width: 30px; height: 30px; border-radius: 9px; cursor: pointer; padding: 0; background-color: {{s.color}}; border: 2px solid #FFFFFF; box-shadow: {{s.ring}}"></button>
            </sc-for>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 12.5px; color: #5B5668">
      <span>New shop? <a href="https://wa.me/" style="font-weight: 600; text-decoration: none; color: {{accent}}">Request a demo</a></span>
      <span aria-hidden="true">·</span>
      <a href="AdminSignIn.dc.html" style="text-decoration: none; color: #5B5668">Platform admin</a>
      <span aria-hidden="true">·</span>
      <span>© Galla Mandi</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["violet","indigo","blue","green","red","dark"],"default":"violet"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: null, show: false };
  }
  renderVals() {
    const B = { violet: ['#6D28D9', '#9333EA'], indigo: ['#4338CA', '#7C3AED'], blue: ['#1D4ED8', '#2563EB'], green: ['#065F46', '#047857'], red: ['#BE123C', '#E11D48'], dark: ['#18181B', '#3F3F46'] };
    const names = { violet: 'Violet', indigo: 'Indigo', blue: 'Blue', green: 'Green', red: 'Red', dark: 'Dark' };
    const k = this.state.theme || this.props.theme || 'violet';
    const b = B[k] || B.violet;
    return {
      themeKey: k,
      accent: b[0],
      ring: b[0] + '26',
      btnA: b[0],
      btnB: b[1],
      btnShadow: b[0] + '80',
      pwType: this.state.show ? 'text' : 'password',
      eyeLabel: this.state.show ? 'Hide password' : 'Show password',
      toggleEye: () => this.setState({ show: !this.state.show }),
      swatches: Object.keys(B).map((key) => ({
        label: names[key] + ' theme',
        color: B[key][1],
        on: key === k ? 'true' : 'false',
        ring: key === k ? '0 0 0 2px ' + B[key][0] : '0 0 0 1px #DCD8E6',
        pick: () => this.setState({ theme: key })
      }))
    };
  }
}
</script>
</body>
</html>
