<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session expired — Galla Mandi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#3B0764}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; overflow: hidden; background-color: #F4F2F8; font-family: Inter, system-ui, sans-serif; color: #1E1B2E">

  <div aria-hidden="true" style="display: flex; flex-wrap: wrap; min-height: 100vh">
    <div style="flex: 0 0 240px; box-sizing: border-box; padding: 24px 18px; background-color: #FFFFFF; border-right: 1px solid #E7E3EF; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 18px">
        <div style="width: 34px; height: 34px; border-radius: 10px; background-color: {{accent}}"></div>
        <span style="font-weight: 800; font-size: 16px">Galla Mandi</span>
      </div>
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; color: {{n.color}}; background-color: {{n.bg}}"><span style="width: 16px; height: 16px; border-radius: 5px; background-color: {{n.dot}}"></span>{{n.label}}</div>
      </sc-for>
    </div>
    <div style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 24px; font-weight: 800">Purchase entry</span><span style="width: 120px; height: 36px; border-radius: 10px; background-color: #E7E3EF"></span></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
        <div style="height: 96px; border-radius: 16px; background-color: #FFFFFF; border: 1px solid #E7E3EF"></div>
        <div style="height: 96px; border-radius: 16px; background-color: #FFFFFF; border: 1px solid #E7E3EF"></div>
        <div style="height: 96px; border-radius: 16px; background-color: #FFFFFF; border: 1px solid #E7E3EF"></div>
        <div style="height: 96px; border-radius: 16px; background-color: #FFFFFF; border: 1px solid #E7E3EF"></div>
      </div>
      <div style="flex: 1 1 auto; min-height: 420px; border-radius: 16px; background-color: #FFFFFF; border: 1px solid #E7E3EF"></div>
    </div>
  </div>

  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(30,27,46,0.55); display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 24px">
    <div role="dialog" aria-modal="true" aria-labelledby="sx-title" style="width: 100%; max-width: 420px; box-sizing: border-box; background-color: #FFFFFF; border-radius: 24px; padding: 32px; box-shadow: 0 32px 64px -16px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 18px">
      <div style="width: 56px; height: 56px; border-radius: 16px; background-color: {{tint}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 id="sx-title" style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Your session has ended</h2>
        <p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #5B5668">You were signed out after 30 minutes without activity. Your unsaved purchase entry is kept as a draft.</p>
        <p lang="ur" dir="rtl" style="margin: 0; font-family: 'Noto Nastaliq Urdu', serif; font-size: 13px; line-height: 2; color: #5B5668">سیشن ختم ہو گیا، دوبارہ سائن ان کریں</p>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background-color: #F6F3FF">
        <div style="width: 36px; height: 36px; border-radius: 50%; background-color: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">HA</div>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">[Owner name]</span><span style="font-size: 12.5px; color: #5B5668">+92 300 •••• 567 · Owner</span></div>
        <a href="Main.dc.html" style="font-size: 12.5px; font-weight: 600; text-decoration: none; color: {{accent}}">Not you?</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="sx-pass" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Password</label>
        <input id="sx-pass" type="password" placeholder="Enter your password" autocomplete="current-password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid {{accent}}; box-shadow: 0 0 0 4px {{ring}}; outline: 0; font: inherit; font-size: 15px; color: #1E1B2E">
      </div>
      <a href="Main.dc.html" style="height: 50px; border-radius: 14px; text-decoration: none; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; background-image: linear-gradient(90deg, {{btnA}}, {{btnB}})">Sign in again</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["violet","indigo","blue","green","red","dark"],"default":"violet"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = { violet: ['#6D28D9', '#9333EA'], indigo: ['#4338CA', '#7C3AED'], blue: ['#1D4ED8', '#2563EB'], green: ['#065F46', '#047857'], red: ['#BE123C', '#E11D48'], dark: ['#18181B', '#3F3F46'] };
    const k = this.props.theme || 'violet';
    const b = B[k] || B.violet;
    const labels = ['Dashboard', 'Daily rates', 'Purchases', 'Sales', 'Traders', 'Khata', 'Payments', 'Reports'];
    return {
      accent: b[0], tint: b[0] + '14', ring: b[0] + '26', btnA: b[0], btnB: b[1],
      nav: labels.map((l, i) => ({ label: l, color: i === 2 ? b[0] : '#5B5668', bg: i === 2 ? b[0] + '14' : 'transparent', dot: i === 2 ? b[0] : '#DCD8E6' }))
    };
  }
}
</script>
</body>
</html>
