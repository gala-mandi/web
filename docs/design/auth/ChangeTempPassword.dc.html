<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change temporary password — Galla Mandi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#3B0764}
input::placeholder{color:#8A8597}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background-color: #F6F3FF; font-family: Inter, system-ui, sans-serif; color: #1E1B2E">
  <div style="flex: 1 1 520px; display: flex; min-height: 100vh">
    <dc-import name="BrandPanel" theme="{{themeKey}}" hint-size="100%,900px"></dc-import>
  </div>
  <main style="flex: 1 1 480px; box-sizing: border-box; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center">
    <div style="width: 100%; max-width: 420px; box-sizing: border-box; background-color: #FFFFFF; border-radius: 24px; padding: 32px 36px; box-shadow: 0 1px 2px rgba(30,27,46,0.06), 0 28px 56px -16px rgba(76,29,149,0.22); display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 50%; background-color: {{tint}}; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px">MB</div>
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 13px; color: #5B5668">Assalam o Alaikum,</span>
          <span style="font-size: 16px; font-weight: 700">[Staff name]</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Choose your own password</h2>
        <p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #5B5668">Your shop owner gave you a temporary password. Replace it now — only you should know your password.</p>
        <p lang="ur" dir="rtl" style="margin: 0; font-family: 'Noto Nastaliq Urdu', serif; font-size: 13px; line-height: 2; color: #5B5668">عارضی پاس ورڈ تبدیل کر کے اپنا پاس ورڈ بنائیں</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ct-temp" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Temporary password</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #DCD8E6; background-color: #FFFFFF">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a4 4 0 1 1-3.5 6L5 19.5V22H2v-3l6.5-6.5A4 4 0 0 1 15 7z"/></svg>
          <input id="ct-temp" type="password" value="temp1234" autocomplete="current-password" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #1E1B2E">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ct-new" style="font-size: 13px; font-weight: 600; color: #3F3A4D">New password</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid {{accent}}; box-shadow: 0 0 0 4px {{ring}}; background-color: #FFFFFF">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="ct-new" type="password" placeholder="At least 8 characters" autocomplete="new-password" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #1E1B2E">
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
          <span style="height: 5px; border-radius: 4px; background-color: #E7E3EF"></span>
          <span style="height: 5px; border-radius: 4px; background-color: #E7E3EF"></span>
          <span style="height: 5px; border-radius: 4px; background-color: #E7E3EF"></span>
          <span style="height: 5px; border-radius: 4px; background-color: #E7E3EF"></span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ct-confirm" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Confirm new password</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #DCD8E6; background-color: #FFFFFF">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="ct-confirm" type="password" placeholder="Type it again" autocomplete="new-password" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #1E1B2E">
        </div>
      </div>

      <a href="PasswordChanged.dc.html" style="height: 52px; border-radius: 14px; text-decoration: none; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; background-image: linear-gradient(90deg, {{btnA}}, {{btnB}}); box-shadow: 0 10px 24px -8px {{btnShadow}}">
        Save and continue <span aria-hidden="true">·</span> <span lang="ur" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 15px; font-weight: 600">جاری رکھیں</span>
      </a>
      <a href="Main.dc.html" style="align-self: center; font-size: 13px; text-decoration: none; color: #5B5668">Sign out</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["violet","indigo","blue","green","red","dark"],"default":"violet"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = { violet: ['#6D28D9', '#9333EA'], indigo: ['#4338CA', '#7C3AED'], blue: ['#1D4ED8', '#2563EB'], green: ['#065F46', '#047857'], red: ['#BE123C', '#E11D48'], dark: ['#18181B', '#3F3F46'] };
    const k = this.props.theme || 'violet';
    const b = B[k] || B.violet;
    return { themeKey: k, accent: b[0], tint: b[0] + '14', ring: b[0] + '26', btnA: b[0], btnB: b[1], btnShadow: b[0] + '80' };
  }
}
</script>
</body>
</html>
