<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in error — Galla Mandi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#3B0764}
input::placeholder{color:#8A8597}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background-color: #F6F3FF; font-family: Inter, system-ui, sans-serif; color: #1E1B2E">
  <div style="flex: 1 1 520px; display: flex; min-height: 100vh">
    <dc-import name="BrandPanel" theme="{{themeKey}}" hint-size="100%,900px"></dc-import>
  </div>
  <main style="flex: 1 1 480px; box-sizing: border-box; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
    <div style="width: 100%; max-width: 420px; box-sizing: border-box; background-color: #FFFFFF; border-radius: 24px; padding: 40px 36px 32px; box-shadow: 0 1px 2px rgba(30,27,46,0.06), 0 28px 56px -16px rgba(76,29,149,0.22); display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Welcome back</h2>
        <p style="margin: 0; font-size: 15px; color: #5B5668">Sign in to your mandi account</p>
      </div>

      <div role="alert" style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 14px; background-color: #FFF1F2; border: 1px solid #FECDD3">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BE123C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 700; color: #9F1239">Phone number or password is incorrect</span>
          <span style="font-size: 13px; color: #9F1239">2 attempts left before sign-in is paused for 1 minute.</span>
          <span lang="ur" dir="rtl" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 12px; line-height: 1.9; text-align: left; color: #9F1239">فون نمبر یا پاس ورڈ غلط ہے</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="se-user" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Phone number or username</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid #DCD8E6; background-color: #FFFFFF">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
          <input id="se-user" type="text" value="0300 1234567" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #1E1B2E">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <label for="se-pass" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Password</label>
          <a href="ForgotPassword.dc.html" style="font-size: 13px; font-weight: 600; text-decoration: none; color: {{accent}}">Forgot password?</a>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 12px; border: 2px solid #E11D48; background-color: #FFFFFF">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BE123C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="se-pass" type="password" value="wrongpass" aria-invalid="true" aria-describedby="se-pass-err" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #1E1B2E">
        </div>
        <span id="se-pass-err" style="font-size: 12.5px; font-weight: 500; color: #BE123C">Check Caps Lock and try again.</span>
      </div>

      <button type="button" style="height: 52px; border: 0; border-radius: 14px; cursor: pointer; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; background-image: linear-gradient(90deg, {{btnA}}, {{btnB}}); box-shadow: 0 10px 24px -8px {{btnShadow}}">
        Try again <span aria-hidden="true">·</span> <span lang="ur" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 15px; font-weight: 600">دوبارہ کوشش کریں</span>
      </button>

      <div style="display: flex; justify-content: center; gap: 16px; font-size: 13px">
        <a href="Main.dc.html" style="font-weight: 600; text-decoration: none; color: {{accent}}">Back to sign in</a>
        <a href="LockedOut.dc.html" style="text-decoration: none; color: #5B5668">See lockout state</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["violet","indigo","blue","green","red","dark"],"default":"violet"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = { violet: ['#6D28D9', '#9333EA'], indigo: ['#4338CA', '#7C3AED'], blue: ['#1D4ED8', '#2563EB'], green: ['#065F46', '#047857'], red: ['#BE123C', '#E11D48'], dark: ['#18181B', '#3F3F46'] };
    const k = this.props.theme || 'violet';
    const b = B[k] || B.violet;
    return { themeKey: k, accent: b[0], btnA: b[0], btnB: b[1], btnShadow: b[0] + '80' };
  }
}
</script>
</body>
</html>
