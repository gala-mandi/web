<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password changed — Galla Mandi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#3B0764}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background-color: #F6F3FF; font-family: Inter, system-ui, sans-serif; color: #1E1B2E">
  <div style="flex: 1 1 520px; display: flex; min-height: 100vh">
    <dc-import name="BrandPanel" theme="{{themeKey}}" hint-size="100%,900px"></dc-import>
  </div>
  <main style="flex: 1 1 480px; box-sizing: border-box; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center">
    <div style="width: 100%; max-width: 420px; box-sizing: border-box; background-color: #FFFFFF; border-radius: 24px; overflow: hidden; box-shadow: 0 1px 2px rgba(30,27,46,0.06), 0 28px 56px -16px rgba(76,29,149,0.22); display: flex; flex-direction: column">
      <div style="position: relative; height: 150px; background-color: #3B2A12">
        <img src="../images/wheat-field.webp" alt="Wheat field at sunrise" style="width: 100%; height: 100%; object-fit: cover; object-position: center 70%; display: block">
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(255,255,255,0.95) 100%)"></div>
      </div>
      <div style="padding: 0 36px 32px; margin-top: -40px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
        <div style="width: 76px; height: 76px; border-radius: 50%; background-color: #047857; border: 6px solid #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -8px rgba(4,120,87,0.6)">
          <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Password changed</h2>
          <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #5B5668">Your new password is ready. We signed you out of 2 other devices to keep your khata safe.</p>
          <p lang="ur" dir="rtl" style="margin: 0; font-family: 'Noto Nastaliq Urdu', serif; font-size: 13px; line-height: 2; color: #5B5668">پاس ورڈ کامیابی سے تبدیل ہو گیا</p>
        </div>
        <a href="Main.dc.html" style="width: 100%; height: 52px; border-radius: 14px; text-decoration: none; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; background-image: linear-gradient(90deg, {{btnA}}, {{btnB}}); box-shadow: 0 10px 24px -8px {{btnShadow}}">
          Continue to sign in <span aria-hidden="true">·</span> <span lang="ur" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 15px; font-weight: 600">سائن ان کریں</span>
        </a>
        <span style="font-size: 12.5px; color: #5B5668">Didn’t do this? <a href="https://wa.me/" style="font-weight: 600; text-decoration: none; color: {{accent}}">Contact support</a></span>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["violet","indigo","blue","green","red","dark"],"default":"violet"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = { violet: ['#6D28D9', '#9333EA'], indigo: ['#4338CA', '#7C3AED'], blue: ['#1D4ED8', '#2563EB'], green: ['#065F46', '#047857'], red: ['#BE123C', '#E11D48'], dark: ['#18181B', '#3F3F46'] };
    const k = this.props.theme || 'violet';
    const b = B[k] || B.violet;
    return { themeKey: k, accent: b[0], btnA: b[0], btnB: b[1], btnShadow: b[0] + '80' };
  }
}
</script>
</body>
</html>
