<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile sign in — Galla Mandi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#3B0764}
input::placeholder{color:#8A8597}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background-color: {{c0}}; font-family: Inter, system-ui, sans-serif; color: #1E1B2E">
  <img src="../images/wheat-grain.webp" alt="" style="position: absolute; top: 0; left: 0; width: 100%; height: 360px; object-fit: cover">
  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 360px; background-image: linear-gradient(160deg, {{c0}} 0%, {{c0a}} 50%, {{c1a}} 100%)"></div>

  <div style="position: relative; box-sizing: border-box; padding: 56px 24px 0; height: 300px; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 38px; height: 38px; border-radius: 11px; background-color: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V9"/><path d="M12 13c-2.5 0-4-1.6-4-4 2.5 0 4 1.6 4 4z"/><path d="M12 13c2.5 0 4-1.6 4-4-2.5 0-4 1.6-4 4z"/><path d="M12 18c-2.5 0-4-1.6-4-4 2.5 0 4 1.6 4 4z"/><path d="M12 18c2.5 0 4-1.6 4-4-2.5 0-4 1.6-4 4z"/></svg>
      </div>
      <span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 800; font-size: 18px">Galla Mandi</span>
      <span style="margin-left: auto; padding: 4px 10px; border-radius: 999px; background-color: rgba(255,255,255,0.18); font-family: 'Noto Nastaliq Urdu', serif; font-size: 12px" lang="ur">اردو</span>
    </div>
    <h1 style="margin: 18px 0 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 32px; line-height: 1.08; font-weight: 800; letter-spacing: -0.03em">Your mandi,<br>in your pocket.</h1>
    <p lang="ur" dir="rtl" style="margin: 0; text-align: left; font-family: 'Noto Nastaliq Urdu', serif; font-size: 16px; line-height: 1.9">اپنی منڈی کا حساب، ہر جگہ</p>
    <div style="display: flex; gap: 8px">
      <span style="padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background-color: rgba(20,10,40,0.3); border: 1px solid rgba(255,255,255,0.25)">Gandum Rs 4,150 ▲</span>
      <span style="padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background-color: rgba(20,10,40,0.3); border: 1px solid rgba(255,255,255,0.25)">Kapas Rs 8,900 ▼</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 300px; box-sizing: border-box; padding: 28px 24px 24px; background-color: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Welcome back</h2>
      <p style="margin: 0; font-size: 14px; color: #5B5668">Sign in to your mandi account</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ms-phone" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Phone number</label>
      <div style="display: flex; align-items: center; height: 52px; border-radius: 14px; border: 2px solid {{accent}}; box-shadow: 0 0 0 4px {{ring}}; overflow: hidden">
        <span style="height: 100%; display: flex; align-items: center; padding: 0 12px; background-color: #F6F3FF; border-right: 1px solid #E7E3EF; font-size: 15px; font-weight: 600; color: #3F3A4D">+92</span>
        <input id="ms-phone" type="tel" inputmode="numeric" value="300 1234567" style="flex: 1 1 auto; min-width: 0; height: 100%; padding: 0 12px; border: 0; outline: 0; font: inherit; font-size: 16px; color: #1E1B2E">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ms-pass" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Password</label>
      <input id="ms-pass" type="password" placeholder="Your password" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #DCD8E6; outline: 0; font: inherit; font-size: 16px; color: #1E1B2E">
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13.5px">
      <label style="display: flex; align-items: center; gap: 8px; color: #3F3A4D"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: {{accent}}">Remember me</label>
      <a href="MobileOtp.dc.html" style="font-weight: 600; text-decoration: none; color: {{accent}}; padding: 12px 0">Forgot password?</a>
    </div>
    <button type="button" style="height: 54px; border: 0; border-radius: 16px; cursor: pointer; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; background-image: linear-gradient(90deg, {{btnA}}, {{btnB}}); box-shadow: 0 10px 24px -8px {{btnShadow}}">
      Sign in <span aria-hidden="true">·</span> <span lang="ur" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 15px; font-weight: 600">داخل ہوں</span>
    </button>
    <button type="button" style="height: 50px; border-radius: 16px; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600; color: #3F3A4D; background-color: #FFFFFF; border: 1px solid #DCD8E6; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><path d="M12 15v2"/><rect x="5" y="11" width="14" height="10" rx="2"/></svg>Use fingerprint
    </button>
    <span style="margin-top: auto; text-align: center; font-size: 12px; color: #5B5668">Private to your shop · Every change recorded</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["violet","indigo","blue","green","red","dark"],"default":"violet"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = { violet: ['#4C1D95', '#9333EA'], indigo: ['#312E81', '#6D28D9'], blue: ['#1E3A8A', '#2563EB'], green: ['#064E3B', '#047857'], red: ['#881337', '#E11D48'], dark: ['#18181B', '#3F3F46'] };
    const B = { violet: ['#6D28D9', '#9333EA'], indigo: ['#4338CA', '#7C3AED'], blue: ['#1D4ED8', '#2563EB'], green: ['#065F46', '#047857'], red: ['#BE123C', '#E11D48'], dark: ['#18181B', '#3F3F46'] };
    const k = this.props.theme || 'violet';
    const p = P[k] || P.violet;
    const b = B[k] || B.violet;
    return { c0: p[0], c0a: p[0] + 'E6', c1a: p[1] + 'D9', accent: b[0], ring: b[0] + '26', btnA: b[0], btnB: b[1], btnShadow: b[0] + '80' };
  }
}
</script>
</body>
</html>
