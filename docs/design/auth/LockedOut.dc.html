<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Too many attempts — Galla Mandi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#3B0764}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background-color: #F6F3FF; font-family: Inter, system-ui, sans-serif; color: #1E1B2E">
  <div style="flex: 1 1 520px; display: flex; min-height: 100vh">
    <dc-import name="BrandPanel" theme="{{themeKey}}" hint-size="100%,900px"></dc-import>
  </div>
  <main style="flex: 1 1 480px; box-sizing: border-box; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center">
    <div style="width: 100%; max-width: 420px; box-sizing: border-box; background-color: #FFFFFF; border-radius: 24px; padding: 40px 36px 32px; box-shadow: 0 1px 2px rgba(30,27,46,0.06), 0 28px 56px -16px rgba(76,29,149,0.22); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
      <div style="width: 112px; height: 112px; border-radius: 50%; background-image: conic-gradient(#D97706 0deg 348deg, #FDE68A 348deg 360deg); display: flex; align-items: center; justify-content: center">
        <div style="width: 96px; height: 96px; border-radius: 50%; background-color: #FFFBEB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 22px; font-weight: 800; color: #92400E; font-variant-numeric: tabular-nums">00:58</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Sign-in paused</h2>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #5B5668">Too many wrong passwords for <strong style="color: #1E1B2E">0300 •••• 567</strong>. You can try again in 1 minute.</p>
        <p lang="ur" dir="rtl" style="margin: 0; font-family: 'Noto Nastaliq Urdu', serif; font-size: 13px; line-height: 2; color: #5B5668">بہت زیادہ غلط کوششیں۔ ایک منٹ بعد دوبارہ کوشش کریں</p>
      </div>
      <div style="width: 100%; box-sizing: border-box; display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background-color: #F6F3FF; text-align: left; font-size: 13px; line-height: 1.5; color: #3F3A4D">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 1px"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/></svg>
        <span>We pause sign-in to protect your shop’s khata. If this wasn’t you, reset your password after the timer ends.</span>
      </div>
      <button type="button" disabled style="width: 100%; height: 52px; border: 0; border-radius: 14px; color: #6B6578; font: inherit; font-size: 16px; font-weight: 700; background-color: #EDEAF3; cursor: not-allowed">Try again in 0:58</button>
      <div style="display: flex; justify-content: center; gap: 16px; font-size: 13px">
        <a href="ForgotPassword.dc.html" style="font-weight: 600; text-decoration: none; color: {{accent}}">Reset password</a>
        <a href="Main.dc.html" style="text-decoration: none; color: #5B5668">Back to sign in</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["violet","indigo","blue","green","red","dark"],"default":"violet"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = { violet: '#6D28D9', indigo: '#4338CA', blue: '#1D4ED8', green: '#065F46', red: '#BE123C', dark: '#18181B' };
    const k = this.props.theme || 'violet';
    return { themeKey: k, accent: B[k] || B.violet };
  }
}
</script>
</body>
</html>
