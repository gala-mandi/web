<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accept invite — Galla Mandi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#3B0764}
input::placeholder{color:#8A8597}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background-color: #F6F3FF; font-family: Inter, system-ui, sans-serif; color: #1E1B2E">
  <div style="flex: 1 1 520px; display: flex; min-height: 100vh">
    <dc-import name="BrandPanel" theme="{{themeKey}}" hint-size="100%,900px"></dc-import>
  </div>
  <main style="flex: 1 1 480px; box-sizing: border-box; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center">
    <div style="width: 100%; max-width: 440px; box-sizing: border-box; background-color: #FFFFFF; border-radius: 24px; padding: 32px 36px; box-shadow: 0 1px 2px rgba(30,27,46,0.06), 0 28px 56px -16px rgba(76,29,149,0.22); display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 27px; font-weight: 800; letter-spacing: -0.02em">You’re invited to join</h2>
        <p lang="ur" dir="rtl" style="margin: 0; font-family: 'Noto Nastaliq Urdu', serif; font-size: 13px; line-height: 2; color: #5B5668">آپ کو منڈی ٹیم میں شامل ہونے کی دعوت دی گئی ہے</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; border: 1px solid #E7E3EF; background-color: #FBFAFE">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 48px; height: 48px; border-radius: 12px; background-color: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 800; font-size: 17px">[BT]</div>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 16px; font-weight: 700">[Shop name]</span>
            <span style="font-size: 13px; color: #5B5668">Invited by [Owner name] · Owner</span>
          </div>
          <span style="padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background-color: {{tint}}; color: {{accent}}">Operator</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 10px; border-top: 1px dashed #DCD8E6; font-size: 12.5px; color: #3F3A4D">
          <span style="display: inline-flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Purchases &amp; sales</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Payments</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>View rates</span>
          <span style="display: inline-flex; align-items: center; gap: 6px; color: #5B5668"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8597" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Reports &amp; settings</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ai-name" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Your full name</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid {{accent}}; box-shadow: 0 0 0 4px {{ring}}; background-color: #FFFFFF">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
          <input id="ai-name" type="text" placeholder="e.g. Muhammad Bilal" autocomplete="name" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #1E1B2E">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ai-phone" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Phone number (from invite)</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #E7E3EF; background-color: #F6F4FA">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="ai-phone" type="tel" value="+92 301 7654321" readonly style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #3F3A4D">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ai-pass" style="font-size: 13px; font-weight: 600; color: #3F3A4D">Create a password</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #DCD8E6; background-color: #FFFFFF">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="ai-pass" type="password" placeholder="At least 8 characters" autocomplete="new-password" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #1E1B2E">
        </div>
      </div>

      <a href="Main.dc.html" style="height: 52px; border-radius: 14px; text-decoration: none; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; background-image: linear-gradient(90deg, {{btnA}}, {{btnB}}); box-shadow: 0 10px 24px -8px {{btnShadow}}">
        Join shop <span aria-hidden="true">·</span> <span lang="ur" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 15px; font-weight: 600">شامل ہوں</span>
      </a>
      <span style="font-size: 12.5px; line-height: 1.5; text-align: center; color: #5B5668">This invite expires in 47 hours and works once. Not you? <a href="Main.dc.html" style="font-weight: 600; text-decoration: none; color: {{accent}}">Ignore it</a></span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["violet","indigo","blue","green","red","dark"],"default":"violet"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = { violet: ['#6D28D9', '#9333EA'], indigo: ['#4338CA', '#7C3AED'], blue: ['#1D4ED8', '#2563EB'], green: ['#065F46', '#047857'], red: ['#BE123C', '#E11D48'], dark: ['#18181B', '#3F3F46'] };
    const k = this.props.theme || 'violet';
    const b = B[k] || B.violet;
    return { themeKey: k, accent: b[0], tint: b[0] + '14', ring: b[0] + '26', btnA: b[0], btnB: b[1], btnShadow: b[0] + '80' };
  }
}
</script>
</body>
</html>
