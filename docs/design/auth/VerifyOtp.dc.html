<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify code — Galla Mandi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#3B0764}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background-color: #F6F3FF; font-family: Inter, system-ui, sans-serif; color: #1E1B2E">
  <div style="flex: 1 1 520px; display: flex; min-height: 100vh">
    <dc-import name="BrandPanel" theme="{{themeKey}}" hint-size="100%,900px"></dc-import>
  </div>
  <main style="flex: 1 1 480px; box-sizing: border-box; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center">
    <div style="width: 100%; max-width: 420px; box-sizing: border-box; background-color: #FFFFFF; border-radius: 24px; padding: 32px 36px; box-shadow: 0 1px 2px rgba(30,27,46,0.06), 0 28px 56px -16px rgba(76,29,149,0.22); display: flex; flex-direction: column; gap: 22px">
      <a href="ForgotPassword.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none; color: #4B4659"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back</a>

      <div style="display: flex; gap: 6px" aria-label="Step 2 of 3">
        <span style="flex: 1 1 0; height: 4px; border-radius: 4px; background-color: {{accent}}"></span>
        <span style="flex: 1 1 0; height: 4px; border-radius: 4px; background-color: {{accent}}"></span>
        <span style="flex: 1 1 0; height: 4px; border-radius: 4px; background-color: #E7E3EF"></span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{accent}}">Step 2 of 3</span>
        <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Enter the 6-digit code</h2>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #5B5668">We sent it on WhatsApp to <strong style="color: #1E1B2E">+92 300 •••• 567</strong>. <a href="ForgotPassword.dc.html" style="font-weight: 600; text-decoration: none; color: {{accent}}">Change</a></p>
        <p lang="ur" dir="rtl" style="margin: 0; font-family: 'Noto Nastaliq Urdu', serif; font-size: 13px; line-height: 2; color: #5B5668">واٹس ایپ پر بھیجا گیا ۶ ہندسوں کا کوڈ درج کریں</p>
      </div>

      <fieldset style="margin: 0; padding: 0; border: 0">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">One-time code</legend>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
            <input type="text" inputmode="numeric" maxlength="1" value="{{d.v}}" aria-label="{{d.label}}" style="width: 100%; box-sizing: border-box; height: 58px; text-align: center; border-radius: 12px; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 24px; font-weight: 800; color: #1E1B2E; outline: 0; border: {{d.border}}; box-shadow: {{d.shadow}}; background-color: {{d.bg}}">
          </sc-for>
        </div>
      </fieldset>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px">
        <span style="display: inline-flex; align-items: center; gap: 6px; color: #5B5668"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Code expires in 4:18</span>
        <span style="color: #5B5668">Resend in <strong style="color: #3F3A4D; font-variant-numeric: tabular-nums">0:42</strong></span>
      </div>

      <a href="NewPassword.dc.html" style="height: 52px; border-radius: 14px; text-decoration: none; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; background-image: linear-gradient(90deg, {{btnA}}, {{btnB}}); box-shadow: 0 10px 24px -8px {{btnShadow}}">
        Verify code <span aria-hidden="true">·</span> <span lang="ur" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 15px; font-weight: 600">تصدیق کریں</span>
      </a>

      <p style="margin: 0; font-size: 12.5px; line-height: 1.55; text-align: center; color: #5B5668">Didn’t get it? Check the number, or <a href="ForgotPassword.dc.html" style="font-weight: 600; text-decoration: none; color: {{accent}}">send by SMS instead</a>.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["violet","indigo","blue","green","red","dark"],"default":"violet"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = { violet: ['#6D28D9', '#9333EA'], indigo: ['#4338CA', '#7C3AED'], blue: ['#1D4ED8', '#2563EB'], green: ['#065F46', '#047857'], red: ['#BE123C', '#E11D48'], dark: ['#18181B', '#3F3F46'] };
    const k = this.props.theme || 'violet';
    const b = B[k] || B.violet;
    const vals = ['4', '8', '2', '9', '', ''];
    return {
      themeKey: k, accent: b[0], btnA: b[0], btnB: b[1], btnShadow: b[0] + '80',
      digits: vals.map((v, i) => ({
        v: v,
        label: 'Digit ' + (i + 1) + ' of 6',
        border: i === 4 ? '2px solid ' + b[0] : (v ? '1px solid #C9C3D6' : '1px solid #DCD8E6'),
        shadow: i === 4 ? '0 0 0 4px ' + b[0] + '26' : 'none',
        bg: v ? '#F6F3FF' : '#FFFFFF'
      }))
    };
  }
}
</script>
</body>
</html>
