# Weekly pull requests for vulnerable and outdated npm packages
# (security updates are raised as soon as an advisory is published).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (used by eslint-config-next) supports TypeScript
      # < 6.1 only; TypeScript 7 breaks `npm run lint`.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    commit-message:
      prefix: chore(deps)
    groups:
      # react and react-dom must move together (react-dom pins react as a peer).
      react:
        patterns: [react, react-dom]
      # Patch and minor updates of dev tools in one PR, to keep the noise down.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
