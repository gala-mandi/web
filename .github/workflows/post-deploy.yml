# Runs when Vercel finishes a production deployment, then checks the live
# sign-in page. A failed run e-mails the person who pushed. A failed Vercel
# build fails here too.
#
# Vercel reports deployments on this repo as commit statuses (context
# "Vercel"), not as GitHub deployments, so this listens to `status`
# events for commits on main. `deployment_status` is kept in case Vercel
# deployments are switched on later.
# Repository variables (optional): SITE_URL, VERCEL_STATUS_CONTEXT.
name: Post-deploy check

on:
  status:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'status' &&
       github.event.context == (vars.VERCEL_STATUS_CONTEXT || 'Vercel') &&
       contains(github.event.branches.*.name, 'main') &&
       github.event.state != 'pending') ||
      (github.event_name == 'deployment_status' &&
       startsWith(github.event.deployment.environment, 'Production') &&
       contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state))
    # At job level, so the many skipped runs (one per status event of every
    # Vercel project) can't cancel the real check.
    concurrency:
      group: post-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vercel deployment failed
        if: >-
          (github.event_name == 'status' && github.event.state != 'success') ||
          (github.event_name == 'deployment_status' && github.event.deployment_status.state != 'success')
        env:
          STATE: ${{ github.event.state || github.event.deployment_status.state }}
          URL: ${{ github.event.target_url || github.event.deployment_status.target_url }}
        run: |
          echo "::error::Vercel production deployment $STATE: $URL"
          exit 1

      - uses: actions/checkout@v4

      - name: Check /login
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://web-mandi-1.vercel.app' }}
          TIMEOUT: "300"
        run: scripts/smoke-check.sh "$SITE_URL/login"
